<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="iUpgrade">
  <!-- Rahul Mark System v2 — Ink field #19140f / orange-500 glyph, 6.4:1
       Own the experience, not the device: the device is the solid mass, the
       upgrade is cut out of it. v1 stroked the device and floated an arrow
       through it, which crowded the walls and read as a generic upload icon. -->
  <rect width="512" height="512" rx="114" fill="#19140f"/>
  <svg x="84" y="84" width="344" height="344" viewBox="0 0 24 24">
    <rect x="4.6" y="1.2" width="14.8" height="21.6" rx="3.4" fill="#ff6b1a"/>
    <path d="M12 5.6 18 12.4h-3.3v5.9H9.3v-5.9H6Z" fill="#19140f"/>
  </svg>
</svg>
